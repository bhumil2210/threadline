name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, catches JDK/toolchain behavior changes

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      # Performance budget (see CLAUDE.md): Lighthouse mobile, 3 runs per page.
      - run: pnpm lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: site/.lighthouseci
          include-hidden-files: true
          retention-days: 14

  verify-java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: [21, 25]
    defaults:
      run:
        working-directory: verify/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test -Pjdk=${{ matrix.jdk }} --console=plain
