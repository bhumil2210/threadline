markers:
  - { at: 1, text: "worker loops on CPU work. It never sleeps or waits, so nothing will throw.", line: 3 }
  - { at: 3, text: "interrupt() sets the flag. crunch() doesn't notice and keeps running.", line: 9 }
  - { at: 4.5, text: "Back at the loop check, isInterrupted() is true, so the loop ends.", line: 2 }
  - { at: 6, text: "worker ends and join() returns. It stopped as soon as it looked.", line: 10 }
state:
  - { at: 0, key: interrupt flag, value: "false" }
  - { at: 3, key: interrupt flag, value: "true" }
takeaway: Code that never blocks must check isInterrupted() itself. Check often, so stopping is quick.
gotcha: The static Thread.interrupted() also checks the flag, but clears it. Use isInterrupted() when you only want to look.
