id: interrupt-flag-check
lang: java
group: Basics
variantOf: stopping-a-thread
order: 2
variant: "busy loop checks the flag"
title: Stopping a busy thread
summary: A thread that never blocks gets no exception. It must check isInterrupted() itself, and stops at its next check.
duration: 7
lanes: [main, worker]
code: |
  Thread worker = new Thread(() -> {
      while (!Thread.currentThread().isInterrupted()) {
          crunch(); // CPU work, never blocks
      }
      System.out.println("saw the flag, stopping");
  }, "worker");
  worker.start();
  Thread.sleep(100);
  worker.interrupt(); // only sets a flag
  worker.join();
events:
  - { id: m1, lane: main, start: 0, end: 1, type: run, label: "start()", line: 7 }
  - { id: m2, lane: main, start: 1, end: 3, type: wait, label: "sleep(100)", line: 8, threadState: TIMED_WAITING }
  - { id: m3, lane: main, start: 3, end: 4, type: run, label: "interrupt()", line: 9 }
  - { id: m4, lane: main, start: 4, end: 6, type: wait, label: "join()", line: 10 }
  - { id: m5, lane: main, start: 6, end: 7, type: run, label: "continues", line: 10 }
  - { id: c1, lane: worker, start: 1, end: 2.5, type: run, label: "crunch()", line: 3 }
