takeaway: A CAS loop lets every thread try at once. The losers retry with the fresh value, so nobody waits for a lock.
gotcha: count.incrementAndGet() does all of this for you, and usually compiles to a single atomic CPU instruction with no visible retry. Write the loop yourself only when the update is more than +1.
