id: race-atomic
lang: java
group: Shared state
variantOf: race-condition
order: 3
variant: "AtomicInteger"
title: Fix it with AtomicInteger
summary: compare-and-set writes only if nobody changed the value since you read it. The loser retries instead of waiting.
duration: 9
lanes: [main, T1, T2]
code: |
  static final AtomicInteger count = new AtomicInteger();

  static void increment() {
      int seen;
      do {
          seen = count.get(); // read
      } while (!count.compareAndSet(seen, seen + 1)); // write only if unchanged
  }

  public static void main(String[] args) throws Exception {
      Thread t1 = new Thread(Main::increment, "T1");
      Thread t2 = new Thread(Main::increment, "T2");
      t1.start();
      t2.start();
      t1.join();
      t2.join();
      System.out.println(count.get()); // always 2
  }
