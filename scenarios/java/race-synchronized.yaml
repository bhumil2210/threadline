id: race-synchronized
lang: java
group: Shared state
variantOf: race-condition
order: 2
variant: "synchronized"
title: Fix it with synchronized
summary: synchronized lets one thread into increment() at a time. T2 waits, then reads the fresh value.
duration: 10
lanes: [main, T1, T2]
code: |
  static int count = 0;

  static synchronized void increment() {
      count++; // only one thread inside at a time
  }

  public static void main(String[] args) throws Exception {
      Thread t1 = new Thread(Main::increment, "T1");
      Thread t2 = new Thread(Main::increment, "T2");
      t1.start();
      t2.start();
      t1.join();
      t2.join();
      System.out.println(count); // always 2
  }
