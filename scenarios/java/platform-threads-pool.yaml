id: platform-threads-pool
lang: java
group: Advanced
variantOf: virtual-threads
order: 2
variant: "2 platform threads"
title: The same tasks on 2 platform threads
summary: Three tasks on a pool of 2 normal threads. A sleeping task keeps its thread, so task 3 waits for a whole task to finish.
duration: 9
lanes: [main, pool-1-thread-1, pool-1-thread-2]
code: |
  try (var executor = Executors.newFixedThreadPool(2)) {
      for (int i = 0; i < 3; i++) {
          int id = i + 1;
          executor.submit(() -> {
              compute(id);          // runs on a pool thread
              Thread.sleep(200);    // blocks: the pool thread sleeps too
              compute(id);          // same thread, which was never free
              return null;
          });
      }
  } // close() waits for every task
