takeaway: A blocking call holds a platform thread for as long as it blocks. With few threads, waiting tasks hold up everyone queued behind them.
gotcha: The old fix was a bigger pool. But each platform thread is an OS thread, so thousands of them get expensive. That's the gap virtual threads fill.
