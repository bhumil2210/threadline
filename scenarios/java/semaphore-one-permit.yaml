takeaway: A Semaphore with one permit lets one thread in at a time, like a lock. Unlike a lock, it has no owner, so any thread can release it.
gotcha: Which waiter gets the next permit isn't guaranteed. Use new Semaphore(1, true) if they must go in arrival order.
