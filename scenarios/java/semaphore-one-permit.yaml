id: semaphore-one-permit
lang: java
group: Coordination
variantOf: semaphore
order: 2
variant: "1 permit"
title: A Semaphore with 1 permit
summary: With one permit, the four workers call the API one at a time. The semaphore works like a lock.
duration: 12
lanes: [worker-1, worker-2, worker-3, worker-4]
code: |
  Semaphore permits = new Semaphore(1); // one at a time, like a lock
  for (int i = 1; i <= 4; i++) {
      int id = i;
      new Thread(() -> {
          permits.acquireUninterruptibly(); // waits while the permit is taken
          try { callApi(id); }
          finally { permits.release(); }    // hand the permit back
      }, "worker-" + id).start();
  }
