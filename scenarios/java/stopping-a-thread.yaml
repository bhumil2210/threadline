takeaway: interrupt() is a polite request. Blocking calls like sleep(), wait(), join() and take() answer it by throwing InterruptedException.
gotcha: Thread.stop() is no help. Since JDK 20 it throws UnsupportedOperationException, and newer JDKs have removed it.
