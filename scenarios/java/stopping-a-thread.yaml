markers:
  - { at: 0, text: "Java can't safely kill a thread. You ask it to stop with interrupt(), and its own code decides.", line: 10 }
  - { at: 1, text: "worker sleeps for 10 seconds. It is TIMED_WAITING and uses no CPU.", line: 3 }
  - { at: 3, text: "main calls interrupt(). That sets worker's interrupt flag.", line: 10 }
  - { at: 4, text: "A sleeping thread notices at once: sleep() throws InterruptedException.", line: 4 }
  - { at: 5, text: "worker cleans up and ends, 10 seconds early. join() returns.", line: 11 }
