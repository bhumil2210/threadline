id: stopping-a-thread
lang: java
group: Basics
order: 2
variant: "interrupt a sleeper"
title: Stopping a thread
summary: interrupt() asks a thread to stop. A sleeping thread answers at once, because sleep() throws InterruptedException.
duration: 6
lanes: [main, worker]
code: |
  Thread worker = new Thread(() -> {
      try {
          Thread.sleep(10_000); // TIMED_WAITING
      } catch (InterruptedException e) {
          System.out.println("woken early, cleaning up");
      }
  }, "worker");
  worker.start();
  Thread.sleep(100);
  worker.interrupt(); // asks worker to stop
  worker.join();
events:
