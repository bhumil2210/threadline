id: cf-pipeline
lang: java
group: CompletableFuture
order: 5
title: A CompletableFuture pipeline
summary: supplyAsync → thenApply → thenAccept. Each step starts when the one before it finishes, and gets its result.
duration: 7
lanes: [main, worker-1]
code: |
  CompletableFuture
      .supplyAsync(() -> fetchUser(42))              // starts on a pool thread
      .thenApply(user -> user.name())                // after fetchUser
      .thenAccept(name -> System.out.println(name))  // after thenApply
      .join();                                       // main waits for the chain
events:
  - { id: b, lane: main, start: 0, end: 1, type: run, label: "build chain", line: 2 }
  - { id: j, lane: main, start: 1, end: 6, type: wait, label: "join()", line: 5 }
  - { id: c, lane: main, start: 6, end: 7, type: run, label: "continues", line: 5 }
  - { id: f, lane: worker-1, start: 1, end: 4, type: io, label: "fetchUser(42)", line: 2 }
  - { id: a, lane: worker-1, start: 4, end: 5, type: run, label: "user.name()", line: 3 }
  - { id: p, lane: worker-1, start: 5, end: 6, type: run, label: "println", line: 4 }
deps:
  - [b, f]
  - [p, c]
markers:
  - { at: 0, text: "supplyAsync starts fetchUser on a common-pool thread. The other steps are only attached.", line: 2 }
  - { at: 1, text: "main calls join() and parks until the whole chain is done.", line: 5 }
  - { at: 4, text: "fetchUser is done. thenApply runs right away, on the same pool thread.", line: 3 }
  - { at: 5, text: "thenAccept gets the name and prints it. It returns nothing, so the chain ends here.", line: 4 }
  - { at: 6, text: "The last step is done, so join() returns and main moves on.", line: 5 }
state:
  - { at: 4, key: value, value: "User[id=42, name=Ada]" }
  - { at: 5, key: value, value: "\"Ada\"" }
  - { at: 6, key: printed, value: "Ada" }
takeaway: You describe the steps once. Each step runs when the previous one finishes, with its result. No thread sits waiting in between.
gotcha: worker-1 is a ForkJoinPool common-pool thread, and those are daemon threads. Without join(), main can finish first and the JVM may exit before anything prints.
