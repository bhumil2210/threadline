  - { id: c1c, lane: carrier-1, start: 3, end: 4, type: run, label: "vt-2 compute", short: "vt-2", line: 7 }
  - { id: c1d, lane: carrier-1, start: 4, end: 5, type: run, label: "vt-3 compute", short: "vt-3", line: 7 }
  - { id: c2a, lane: carrier-2, start: 0, end: 1, type: run, label: "vt-2 compute", short: "vt-2", line: 5 }
