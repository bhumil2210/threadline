markers:
  - { at: 0, text: "Three virtual threads, two carriers. vt-1 and vt-2 mount; vt-3 waits for a free carrier.", line: 5 }
  - { at: 1, text: "vt-1 and vt-2 call sleep(). They unmount, so carrier-1 is free for vt-3.", line: 6 }
  - { at: 2, text: "All three are asleep and both carriers are idle. No OS thread is stuck waiting.", line: 6 }
  - { at: 3, text: "The sleeps end. vt-1 remounts on carrier-2 and vt-2 on carrier-1: they swapped.", line: 7 }
  - { at: 4, text: "vt-3 wakes up and finishes on carrier-1.", line: 7 }
  - { at: 5, text: "All tasks are done, so close() returns.", line: 11 }
state:
  - { at: 0, key: waiting for a carrier, value: "vt-3" }
  - { at: 1, key: waiting for a carrier, value: "none" }
  - { at: 0, key: asleep (unmounted), value: "none" }
  - { at: 1, key: asleep (unmounted), value: "vt-1, vt-2" }
  - { at: 2, key: asleep (unmounted), value: "vt-1, vt-2, vt-3" }
  - { at: 3, key: asleep (unmounted), value: "vt-3" }
  - { at: 4, key: asleep (unmounted), value: "none" }
takeaway: A virtual thread borrows a carrier only while it runs. When it blocks, it unmounts, so a few carriers can serve thousands of waiting tasks.
gotcha: Before JDK 24, blocking inside synchronized pinned a virtual thread to its carrier, so it couldn't unmount. JDK 24 fixed that (JEP 491). Native calls still pin.
