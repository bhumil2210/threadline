id: virtual-threads
lang: java
group: Advanced
order: 17
variant: "virtual threads"
title: Virtual threads
summary: Three virtual threads share two real (carrier) threads. When one blocks, it steps off its carrier so another can run.
duration: 6
lanes: [main, carrier-1, carrier-2]
code: |
  ThreadFactory vts = Thread.ofVirtual().name("vt-", 1).factory();
  try (var executor = Executors.newThreadPerTaskExecutor(vts)) {
      for (int i = 0; i < 3; i++) {
          executor.submit(() -> {
              compute();            // runs on a carrier thread
              Thread.sleep(200);    // blocks: the virtual thread unmounts
              compute();            // remounts, maybe on another carrier
              return null;
          });
      }
  } // close() waits for every task
events:
  - { id: m, lane: main, start: 0, end: 5, type: wait, label: "executor.close()", line: 11 }
  - { id: m2, lane: main, start: 5, end: 6, type: run, label: "continues", line: 11 }
  - { id: c1a, lane: carrier-1, start: 0, end: 1, type: run, label: "vt-1 compute", short: "vt-1", line: 5 }
