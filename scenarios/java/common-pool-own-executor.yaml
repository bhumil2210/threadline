deps:
  - [h1, q]
  - [q, h3]
  - [r3, md]
markers:
  - { at: 0, text: "The same stream fills the common pool, as before.", line: 2 }
  - { at: 1, text: "This time supplyAsync gets ioPool as its second argument.", line: 6 }
  - { at: 2, text: "io-1 is free, so quickTask runs at once.", line: 6 }
  - { at: 3, text: "http-1 has its answer while the stream is still busy.", line: 7 }
  - { at: 7, text: "The stream finishes on its own time. Neither one got in the other's way.", line: 2 }
state:
  - { at: 0, key: free pool threads, value: "0 of 2" }
  - { at: 7, key: free pool threads, value: "2 of 2" }
  - { at: 1, key: queued, value: "none" }
takeaway: Give blocking or latency-sensitive work its own executor. Pass it as the last argument to supplyAsync and the other *Async methods.
gotcha: The executor isn't inherited. A later thenApplyAsync with no executor goes back to the common pool.
