id: common-pool-own-executor
lang: java
group: Advanced
variantOf: common-pool
order: 2
variant: "its own executor"
title: Give the task its own executor
summary: The same request with its own pool. quickTask runs at once on io-1 while the stream keeps the common pool busy.
duration: 9
lanes: [main, commonPool-1, commonPool-2, http-1, io-1]
code: |
  // A batch job on main:
  List.of(1, 2, 3, 4, 5, 6).parallelStream()
      .forEach(id -> buildReport(id)); // slow and blocking: holds a common-pool thread

  // Meanwhile, a request handler on http-1:
  String r = CompletableFuture.supplyAsync(() -> quickTask(), ioPool) // its own pool
      .join(); // runs at once on io-1
events:
  - { id: r4, lane: main, start: 0, end: 3, type: io, label: "buildReport(4)", short: "report 4", line: 3 }
  - { id: r1, lane: main, start: 3, end: 6, type: io, label: "buildReport(1)", short: "report 1", line: 3 }
  - { id: mw, lane: main, start: 6, end: 7, type: wait, label: "waits for the stream", short: "wait", line: 2 }
  - { id: md, lane: main, start: 7, end: 8, type: run, label: "stream done", short: "done", line: 2 }
  - { id: r2, lane: commonPool-1, start: 0, end: 3, type: io, label: "buildReport(2)", short: "report 2", line: 3 }
  - { id: r3, lane: commonPool-1, start: 3, end: 7, type: io, label: "buildReport(3)", short: "report 3", line: 3 }
  - { id: r6, lane: commonPool-2, start: 0, end: 3, type: io, label: "buildReport(6)", short: "report 6", line: 3 }
  - { id: r5, lane: commonPool-2, start: 3, end: 6, type: io, label: "buildReport(5)", short: "report 5", line: 3 }
  - { id: h1, lane: http-1, start: 1, end: 2, type: run, label: "supplyAsync", short: "submit", line: 6 }
  - { id: h2, lane: http-1, start: 2, end: 3, type: wait, label: "join()", line: 7 }
  - { id: h3, lane: http-1, start: 3, end: 4, type: run, label: "got ok", short: "ok", line: 7 }
