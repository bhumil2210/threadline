id: thread-pool-four
lang: java
group: Executors
variantOf: thread-pool-queue
order: 2
variant: "4 threads"
title: A pool of 4 threads
summary: The same 4 tasks on a pool of 4. Every task gets a thread at once, and nothing waits in the queue.
duration: 6
lanes: [main, pool-1-thread-1, pool-1-thread-2, pool-1-thread-3, pool-1-thread-4]
code: |
  ExecutorService pool = Executors.newFixedThreadPool(4);
  for (int i = 1; i <= 4; i++) {
      int id = i;
      pool.submit(() -> work("task " + id));
  }
  pool.shutdown();
  pool.awaitTermination(1, TimeUnit.MINUTES);
