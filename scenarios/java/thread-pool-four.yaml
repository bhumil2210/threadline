takeaway: Up to the pool size, tasks start at once; past it, they queue. Size the pool for the work, about one thread per core for CPU work and more for tasks that wait on I/O.
gotcha: Threads aren't free. Each platform thread is an OS thread that reserves stack memory (often 1 MB), and more threads than cores means more context switching.
