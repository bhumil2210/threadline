takeaway: wait() releases the lock and parks until notified; sleep() keeps it. wait() only works inside synchronized on the same object.
gotcha: Always wait in a while loop that rechecks the condition. A thread can wake without a notify (a spurious wakeup), or find the condition changed again by someone else.
