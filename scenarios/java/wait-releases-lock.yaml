id: wait-releases-lock
lang: java
group: Basics
variantOf: wait-vs-sleep
order: 2
variant: "wait() releases it"
title: wait() releases the lock
summary: wait() lets go of the lock and parks until notified. notifier gets in at once, and waiter takes the lock back afterwards.
duration: 6
lanes: [waiter, notifier]
code: |
  static final Object lock = new Object();
  static boolean ready = false;

  static void waiter() throws InterruptedException {
      synchronized (lock) {
          while (!ready) {
              lock.wait(); // lets go of the lock while it waits
          }
          System.out.println("waiter: ready");
      }
  }

  static void notifier() {
      synchronized (lock) { // gets in right away
          ready = true;
          lock.notifyAll(); // wakes waiter, which still needs the lock back
      }
  }
