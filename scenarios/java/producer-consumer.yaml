takeaway: A BlockingQueue is the hand-off point. put() waits when it's full and take() waits when it's empty, so a fast producer can't run away from a slow consumer.
gotcha: An unbounded queue, like new LinkedBlockingQueue<>(), never makes put() wait. A fast producer then fills memory instead of slowing down.
