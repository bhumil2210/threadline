markers:
  - { at: 0, text: "The consumer starts first. The queue is empty, so take() parks it.", line: 11 }
  - { at: 1, text: "put(a) wakes the consumer. It takes a and starts handling it.", line: 11 }
  - { at: 2, text: "b and c fill the queue. It holds only 2, so put(d) parks the producer.", line: 5 }
  - { at: 3, text: "The consumer takes b. That frees a slot, so put(d) goes through.", line: 5 }
  - { at: 5, text: "The producer is done. The consumer drains the queue at its own pace.", line: 12 }
