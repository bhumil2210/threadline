id: latch-loader-throws
lang: java
group: Coordination
variantOf: count-down-latch
order: 2
variant: "a loader throws"
title: When a loader throws
summary: config's load() throws before countDown(). The count sticks at 1, and main waits forever.
duration: 8
lanes: [main, db, cache, config]
code: |
  CountDownLatch ready = new CountDownLatch(3);
  for (String name : List.of("db", "cache", "config")) {
      new Thread(() -> {
          load(name);        // config throws here
          ready.countDown(); // so config never counts down
      }, name).start();
  }
  ready.await(); // stuck at 1: waits forever
  System.out.println("all loaded, start serving"); // never printed
