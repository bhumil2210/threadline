takeaway: synchronized makes other threads wait their turn. A CAS loop lets every thread try, and the losers retry.
gotcha: incrementAndGet() usually compiles to a single atomic CPU instruction, so it has no visible retry. Write the CAS loop yourself only when the update is more than +1.
