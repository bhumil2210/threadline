takeaway: An unbounded queue never pushes back. A slow consumer just means a longer queue, until memory runs out.
gotcha: Executors.newFixedThreadPool uses an unbounded LinkedBlockingQueue. If tasks can arrive faster than they finish, build a ThreadPoolExecutor with a bounded queue instead.
