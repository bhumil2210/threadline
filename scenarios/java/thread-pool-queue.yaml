id: thread-pool-queue
lang: java
group: Executors
order: 8
variant: "2 threads"
title: How a thread pool runs tasks
summary: A fixed pool runs as many tasks as it has threads. The rest wait in a queue for the next free thread.
duration: 8
lanes: [main, pool-1-thread-1, pool-1-thread-2]
code: |
  ExecutorService pool = Executors.newFixedThreadPool(2);
  for (int i = 1; i <= 4; i++) {
      int id = i;
      pool.submit(() -> work("task " + id));
  }
  pool.shutdown();
  pool.awaitTermination(1, TimeUnit.MINUTES);
