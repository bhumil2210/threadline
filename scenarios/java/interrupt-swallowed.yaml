markers:
  - { at: 1, text: "worker sleeps in a loop and checks the flag each time round.", line: 2 }
  - { at: 3, text: "main calls interrupt(). The flag is set.", line: 12 }
  - { at: 4, text: "sleep() throws, and throwing clears the flag. The catch block ignores it.", line: 6 }
  - { at: 5, text: "The loop checks the flag: false. worker goes back to sleep as if nothing happened.", line: 2 }
  - { at: 6, text: "The request to stop is lost. main waits in join() forever.", line: 13 }
