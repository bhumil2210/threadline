takeaway: Never swallow InterruptedException. Let it propagate, or restore the flag with Thread.currentThread().interrupt() in the catch.
gotcha: A catch-all catch (Exception e) around a blocking call eats interrupts the same way. Then even executor.shutdownNow() can't stop the task.
