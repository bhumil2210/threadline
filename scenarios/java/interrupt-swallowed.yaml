id: interrupt-swallowed
lang: java
group: Basics
variantOf: stopping-a-thread
order: 3
variant: "exception swallowed"
title: A swallowed interrupt
summary: Catching InterruptedException and ignoring it clears the flag. The loop never sees the request, and the thread never stops.
duration: 9
lanes: [main, worker]
code: |
  Thread worker = new Thread(() -> {
      while (!Thread.currentThread().isInterrupted()) {
          try {
              Thread.sleep(1_000);
          } catch (InterruptedException e) {
              // swallowed: throwing it cleared the flag
          }
      }
  }, "worker");
  worker.start();
  Thread.sleep(100);
  worker.interrupt();
  worker.join(); // waits forever
events:
