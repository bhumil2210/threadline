id: visibility-volatile
lang: java
group: Shared state
variantOf: visibility
order: 2
variant: "volatile"
title: Fix it with volatile
summary: volatile makes every read go to memory, so worker sees stop = true on its next lap and exits.
duration: 7
lanes: [main, worker]
code: |
  static volatile boolean stop = false; // every read sees the latest write

  public static void main(String[] args) throws Exception {
      Thread worker = new Thread(() -> {
          long spins = 0;
          while (!stop) { // reads stop from memory on every loop
              spins++;
          }
          System.out.println("worker stopped after " + spins + " spins");
      }, "worker");
      worker.start();
      Thread.sleep(1_000);
      stop = true; // main writes the flag
      System.out.println("main set stop = true");
      worker.join(); // returns soon after
  }
