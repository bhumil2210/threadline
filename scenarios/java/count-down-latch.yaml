id: count-down-latch
lang: java
group: Coordination
order: 13
variant: "all loaders succeed"
title: Wait for N things with CountDownLatch
summary: main waits until three loaders have each counted down once. Then the latch opens.
duration: 6
lanes: [main, db, cache, config]
code: |
  CountDownLatch ready = new CountDownLatch(3);
  for (String name : List.of("db", "cache", "config")) {
      new Thread(() -> {
          load(name);
          ready.countDown(); // one fewer to wait for
      }, name).start();
  }
  ready.await(); // main waits until the count reaches 0
  System.out.println("all loaded, start serving");
