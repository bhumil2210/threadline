takeaway: A CountDownLatch lets a thread wait for N things to happen. Each countDown() is one thing; await() returns when the count hits 0.
gotcha: If a loader throws before countDown(), the count never reaches 0 and main waits forever. Count down in a finally block, or use await with a timeout. A latch is also single-use; it can't be reset.
