id: race-condition
lang: java
group: Shared state
order: 4
variant: "count++"
title: Why count++ loses updates
summary: Two threads each run count++ once. The result can be 1, not 2.
duration: 9
lanes: [main, T1, T2]
code: |
  static int count = 0;

  static void increment() {
      count++; // read count, add 1, write count
  }

  public static void main(String[] args) throws Exception {
      Thread t1 = new Thread(Main::increment, "T1");
      Thread t2 = new Thread(Main::increment, "T2");
      t1.start();
      t2.start();
      t1.join();
      t2.join();
      System.out.println(count); // can print 1
  }
