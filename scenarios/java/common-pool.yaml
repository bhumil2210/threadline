markers:
  - { at: 0, text: "parallelStream splits the work over the common pool: 2 workers here, plus main itself.", line: 2 }
  - { at: 1, text: "A request on http-1 calls supplyAsync with no executor. That's the same common pool.", line: 6 }
  - { at: 2, text: "Every common-pool thread is stuck in a blocking report. quickTask waits in the queue.", line: 7 }
  - { at: 6, text: "commonPool-2 runs out of report work and finally picks up quickTask. A 1-unit task waited 5.", line: 6 }
  - { at: 7, text: "http-1 gets its answer, and the stream finishes.", line: 7 }
state:
  - { at: 0, key: free pool threads, value: "0 of 2" }
  - { at: 1, key: queued, value: "quickTask" }
  - { at: 6, key: queued, value: "none" }
  - { at: 7, key: free pool threads, value: "2 of 2" }
takeaway: parallelStream and CompletableFuture's default async methods share one JVM-wide pool, sized for CPU work. Blocking calls there slow down unrelated code.
gotcha: The common pool has one thread fewer than you have CPU cores. In a 2-core container that's a single thread for the whole JVM.
