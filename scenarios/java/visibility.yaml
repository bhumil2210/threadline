id: visibility
lang: java
group: Shared state
order: 5
variant: "plain field"
title: Why a thread never sees your flag
summary: main sets stop = true, but worker keeps spinning forever. Without volatile, Java doesn't promise worker ever sees the write.
duration: 9
lanes: [main, worker]
code: |
  static boolean stop = false; // a plain field

  public static void main(String[] args) throws Exception {
      Thread worker = new Thread(() -> {
          long spins = 0;
          while (!stop) { // the JIT may read stop once and never again
              spins++;
          }
          System.out.println("worker stopped after " + spins + " spins");
      }, "worker");
      worker.start();
      Thread.sleep(1_000);
      stop = true; // main writes the flag
      System.out.println("main set stop = true");
      worker.join(); // can wait forever
  }
