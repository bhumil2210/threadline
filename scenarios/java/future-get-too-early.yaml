id: future-get-too-early
lang: java
group: Executors
variantOf: future-get-blocks
order: 2
variant: "get() too early"
title: Calling get() too early
summary: get() right after submit() makes main wait at once. doOtherWork can only start after slowCall, so nothing overlaps.
duration: 9
lanes: [main, pool-1-thread-1]
code: |
  ExecutorService pool = Executors.newSingleThreadExecutor();
  Future<String> f = pool.submit(() -> slowCall()); // returns right away
  String result = f.get();                          // main blocks at once
  doOtherWork();                                    // starts only after slowCall
  System.out.println(result);
  pool.shutdown();
events:
  - { id: s, lane: main, start: 0, end: 1, type: run, label: "submit()", line: 2 }
  - { id: g, lane: main, start: 1, end: 6, type: wait, label: "f.get(): WAITING", short: "get()", line: 3 }
  - { id: o, lane: main, start: 6, end: 8, type: run, label: "doOtherWork()", line: 4 }
  - { id: p, lane: main, start: 8, end: 9, type: run, label: "println", line: 5 }
  - { id: c, lane: pool-1-thread-1, start: 1, end: 6, type: io, label: "slowCall()", line: 2 }
deps:
  - [s, c]
  - [c, o]
markers:
  - { at: 0, text: "submit() hands slowCall() to the pool and returns a Future, as before.", line: 2 }
  - { at: 1, text: "get() comes right away. main parks while slowCall runs.", line: 3 }
  - { at: 6, text: "slowCall returns. Only now can doOtherWork start.", line: 4 }
  - { at: 8, text: "Done at 9 instead of 7. The two could have run side by side.", line: 5 }
state:
